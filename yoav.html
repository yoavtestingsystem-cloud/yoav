<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>האתר בשדרוג</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base: #0a1526;
    --bg-deep: #060d18;
    --grid-line: rgba(79, 209, 197, 0.07);
    --grid-line-strong: rgba(79, 209, 197, 0.14);
    --cyan: #4fd1c5;
    --cyan-soft: rgba(79, 209, 197, 0.35);
    --amber: #ffb454;
    --text-primary: #eaf3f6;
    --text-muted: #7f97ab;
    --text-dim: #506274;
    --panel-border: #24425a;
    --panel-bg: rgba(11, 22, 38, 0.72);
    --danger: #ff6b6b;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Rubik', sans-serif;
    overflow-x: hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding: 32px 18px;
  }

  /* ---------- Background: blueprint grid + glow ---------- */
  .bg-grid{
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px, 140px 140px, 140px 140px;
    background-position: center;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 40%, transparent 90%);
    animation: gridDrift 40s linear infinite;
    z-index:0;
  }
  @keyframes gridDrift{
    0%{ background-position: 0 0, 0 0, 0 0, 0 0; }
    100%{ background-position: 280px 0, 0 280px, 140px 0, 0 140px; }
  }

  .bg-glow{
    position:fixed; inset:0;
    background:
      radial-gradient(600px 400px at 18% 15%, rgba(79,209,197,0.10), transparent 60%),
      radial-gradient(500px 380px at 85% 85%, rgba(255,180,84,0.07), transparent 60%),
      radial-gradient(1200px 800px at 50% 50%, var(--bg-base), var(--bg-deep));
    z-index:0;
  }

  .particles{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .particle{
    position:absolute; bottom:-10px;
    width:3px; height:3px; border-radius:50%;
    background: var(--cyan);
    box-shadow: 0 0 6px 1px var(--cyan-soft);
    opacity:0;
    animation: rise linear forwards;
  }
  @keyframes rise{
    0%{ opacity:0; transform: translateY(0) translateX(0); }
    10%{ opacity:.8; }
    90%{ opacity:.5; }
    100%{ opacity:0; transform: translateY(-100vh) translateX(var(--drift, 20px)); }
  }

  /* ---------- Main panel ---------- */
  .stage{ position:relative; z-index:2; width:100%; max-width: 660px; }

  .badge-row{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:22px;
    font-family:'Fira Code', monospace;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .badge-row .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--danger);
    box-shadow: 0 0 0 0 rgba(255,107,107,.6);
    animation: pulseDot 1.6s ease-out infinite;
  }
  @keyframes pulseDot{
    0%{ box-shadow: 0 0 0 0 rgba(255,107,107,.55); }
    70%{ box-shadow: 0 0 0 9px rgba(255,107,107,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,107,107,0); }
  }

  .panel{
    position:relative;
    background: var(--panel-bg);
    backdrop-filter: blur(6px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 44px 40px 36px;
    box-shadow: 0 0 0 1px rgba(79,209,197,0.04), 0 30px 60px -20px rgba(0,0,0,0.6);
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
    overflow:hidden;
  }

  /* corner HUD brackets */
  .panel::before, .panel::after,
  .corner-br, .corner-bl{
    content:''; position:absolute; width:22px; height:22px;
    border-color: var(--cyan); border-style: solid; opacity:.75;
  }
  .panel::before{ top:-1px; left:-1px; border-width: 2px 0 0 2px; border-radius: 6px 0 0 0; }
  .panel::after{ top:-1px; right:-1px; border-width: 2px 2px 0 0; border-radius: 0 6px 0 0; }
  .corner-bl{ bottom:-1px; left:-1px; border-width: 0 0 2px 2px; border-radius: 0 0 0 6px; }
  .corner-br{ bottom:-1px; right:-1px; border-width: 0 2px 2px 0; border-radius: 0 0 6px 0; }

  /* scanning sweep line */
  .scan{
    position:absolute; left:0; right:0; height:70px; top:-70px;
    background: linear-gradient(180deg, transparent, rgba(79,209,197,0.12), transparent);
    animation: sweep 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%{ top:-70px; }
    50%{ top:100%; }
    100%{ top:-70px; }
  }

  .gear-row{
    display:flex; align-items:center; justify-content:center;
    gap: 18px; margin-bottom: 22px;
  }
  .gear-wrap svg{ display:block; filter: drop-shadow(0 0 6px var(--cyan-soft)); }
  .gear-wrap.g1 svg{ width:46px; height:46px; animation: spin 7s linear infinite; }
  .gear-wrap.g2 svg{ width:64px; height:64px; animation: spinRev 9s linear infinite; color: var(--amber); filter: drop-shadow(0 0 6px rgba(255,180,84,.35)); }
  .gear-wrap.g3 svg{ width:34px; height:34px; animation: spin 5s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes spinRev{ to{ transform: rotate(-360deg); } }

  h1{
    text-align:center;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 12px;
    line-height:1.25;
    background: linear-gradient(90deg, #fff, var(--cyan) 60%, var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle{
    text-align:center;
    color: var(--text-muted);
    font-size: 16px;
    line-height:1.7;
    max-width: 460px;
    margin: 0 auto 30px;
  }
  .subtitle strong{ color: var(--text-primary); font-weight:600; }

  /* progress */
  .progress-label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Fira Code', monospace; font-size:12.5px; color: var(--text-dim);
    margin-bottom:8px;
  }
  .progress-label #pct{ color: var(--cyan); font-weight:500; }

  .progress-track{
    position:relative;
    height:12px; border-radius: 7px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    overflow:hidden;
    margin-bottom: 26px;
  }
  .progress-fill{
    position:relative; height:100%; width:0%;
    border-radius: 6px;
    background: repeating-linear-gradient(-45deg, var(--cyan) 0 10px, #2fa89b 10px 20px);
    box-shadow: 0 0 14px var(--cyan-soft);
    transition: width 1.4s cubic-bezier(.4,0,.2,1);
    background-size: 200% 100%;
    animation: stripes 1.4s linear infinite;
  }
  @keyframes stripes{ from{ background-position: 0 0; } to{ background-position: 40px 0; } }

  /* console */
  .console{
    background: var(--bg-deep);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 18px;
    font-family: 'Fira Code', monospace;
    font-size: 12.5px;
    color: var(--cyan);
    height: 118px;
    overflow:hidden;
    position:relative;
    text-align: left;
    direction: ltr;
  }
  .console::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(transparent 70%, var(--bg-deep));
    pointer-events:none;
  }
  .console .line{ margin: 0 0 6px; white-space: nowrap; opacity:0; animation: fadeIn .35s forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }
  .console .cursor{ display:inline-block; width:7px; height:12px; background: var(--cyan); margin-inline-start:2px; animation: blink 1s step-end infinite; vertical-align:middle; }
  @keyframes blink{ 50%{ opacity:0; } }

  .foot{
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px dashed var(--panel-border);
    display:flex; flex-wrap:wrap; gap:14px 22px;
    align-items:center; justify-content:center;
    font-size: 13.5px; color: var(--text-muted);
  }
  .foot a{ color: var(--cyan); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .foot a:hover{ text-decoration:underline; }
  .foot svg{ width:15px; height:15px; }

  .toolbelt{
    position:absolute; z-index:3;
    color: var(--cyan);
    opacity:.55;
    filter: drop-shadow(0 0 8px var(--cyan-soft));
  }
  .toolbelt svg{ width:100%; height:100%; }
  .t1{ top:8%; left:2%; width:36px; height:36px; animation: float1 6s ease-in-out infinite; }
  .t2{ bottom:12%; right:1%; width:30px; height:30px; color:var(--amber); filter: drop-shadow(0 0 8px rgba(255,180,84,.35)); animation: float2 7s ease-in-out infinite; }
  .t3{ top:4%; right:6%; width:22px; height:22px; animation: float1 5s ease-in-out infinite .5s; }
  @keyframes float1{ 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-10px) rotate(8deg); } }
  @keyframes float2{ 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(8px) rotate(-10deg); } }

  @media (max-width: 560px){
    .panel{ padding: 34px 22px 28px; }
    .console{ font-size: 11.5px; }
    .t1, .t2, .t3{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    .panel{ transform:none !important; }
  }
</style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div class="particles" id="particles"></div>

  <div class="stage">

    <div class="badge-row">
      <span class="dot"></span>
      <span>STATUS: SYSTEM_MAINTENANCE // לא זמין כעת</span>
    </div>

    <div class="panel" id="panel">
      <span class="scan"></span>
      <span class="corner-bl"></span>
      <span class="corner-br"></span>

      <span class="toolbelt t1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <span class="toolbelt t2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2.5 21 9l-2.5 2.5-3-1-2 2 4 4-2 2-4-4-2 2 1 3L8 21l-6.5-6.5L4 12l1 3 2-2-4-4 2-2 4 4 2-2-1-3z"/></svg>
      </span>
      <span class="toolbelt t3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </span>

      <div class="gear-row">
        <span class="gear-wrap g3">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 3.2-1.9-.3a7.6 7.6 0 0 0-.5-1.3l1.2-1.6a1 1 0 0 0-.1-1.3l-1.2-1.2a1 1 0 0 0-1.3-.1l-1.6 1.2a7.6 7.6 0 0 0-1.3-.5l-.3-1.9A1 1 0 0 0 13.4 3h-1.7a1 1 0 0 0-1 .8l-.3 1.9c-.5.1-.9.3-1.3.5L7.5 5a1 1 0 0 0-1.3.1L5 6.3a1 1 0 0 0-.1 1.3l1.2 1.6c-.2.4-.4.8-.5 1.3l-1.9.3a1 1 0 0 0-.8 1v1.7a1 1 0 0 0 .8 1l1.9.3c.1.5.3.9.5 1.3l-1.2 1.6a1 1 0 0 0 .1 1.3l1.2 1.2a1 1 0 0 0 1.3.1l1.6-1.2c.4.2.8.4 1.3.5l.3 1.9a1 1 0 0 0 1 .8h1.7a1 1 0 0 0 1-.8l.3-1.9c.5-.1.9-.3 1.3-.5l1.6 1.2a1 1 0 0 0 1.3-.1l1.2-1.2a1 1 0 0 0 .1-1.3l-1.2-1.6c.2-.4.4-.8.5-1.3l1.9-.3a1 1 0 0 0 .8-1v-1.7a1 1 0 0 0-.8-1z"/></svg>
        </span>
        <span class="gear-wrap g2">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 3.2-1.9-.3a7.6 7.6 0 0 0-.5-1.3l1.2-1.6a1 1 0 0 0-.1-1.3l-1.2-1.2a1 1 0 0 0-1.3-.1l-1.6 1.2a7.6 7.6 0 0 0-1.3-.5l-.3-1.9A1 1 0 0 0 13.4 3h-1.7a1 1 0 0 0-1 .8l-.3 1.9c-.5.1-.9.3-1.3.5L7.5 5a1 1 0 0 0-1.3.1L5 6.3a1 1 0 0 0-.1 1.3l1.2 1.6c-.2.4-.4.8-.5 1.3l-1.9.3a1 1 0 0 0-.8 1v1.7a1 1 0 0 0 .8 1l1.9.3c.1.5.3.9.5 1.3l-1.2 1.6a1 1 0 0 0 .1 1.3l1.2 1.2a1 1 0 0 0 1.3.1l1.6-1.2c.4.2.8.4 1.3.5l.3 1.9a1 1 0 0 0 1 .8h1.7a1 1 0 0 0 1-.8l.3-1.9c.5-.1.9-.3 1.3-.5l1.6 1.2a1 1 0 0 0 1.3-.1l1.2-1.2a1 1 0 0 0 .1-1.3l-1.2-1.6c.2-.4.4-.8.5-1.3l1.9-.3a1 1 0 0 0 .8-1v-1.7a1 1 0 0 0-.8-1z"/></svg>
        </span>
        <span class="gear-wrap g1">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 3.2-1.9-.3a7.6 7.6 0 0 0-.5-1.3l1.2-1.6a1 1 0 0 0-.1-1.3l-1.2-1.2a1 1 0 0 0-1.3-.1l-1.6 1.2a7.6 7.6 0 0 0-1.3-.5l-.3-1.9A1 1 0 0 0 13.4 3h-1.7a1 1 0 0 0-1 .8l-.3 1.9c-.5.1-.9.3-1.3.5L7.5 5a1 1 0 0 0-1.3.1L5 6.3a1 1 0 0 0-.1 1.3l1.2 1.6c-.2.4-.4.8-.5 1.3l-1.9.3a1 1 0 0 0-.8 1v1.7a1 1 0 0 0 .8 1l1.9.3c.1.5.3.9.5 1.3l-1.2 1.6a1 1 0 0 0 .1 1.3l1.2 1.2a1 1 0 0 0 1.3.1l1.6-1.2c.4.2.8.4 1.3.5l.3 1.9a1 1 0 0 0 1 .8h1.7a1 1 0 0 0 1-.8l.3-1.9c.5-.1.9-.3 1.3-.5l1.6 1.2a1 1 0 0 0 1.3-.1l1.2-1.2a1 1 0 0 0 .1-1.3l-1.2-1.6c.2-.4.4-.8.5-1.3l1.9-.3a1 1 0 0 0 .8-1v-1.7a1 1 0 0 0-.8-1z"/></svg>
        </span>
      </div>

      <h1>האתר עובר שדרוג</h1>
      <p class="subtitle">
        אנחנו כרגע <strong>משפרים ומחזקים</strong> את המערכת מאחורי הקלעים.
        לא ניתן להשתמש באתר כרגע — אבל אנחנו כבר עובדים על זה, ונחזור חזקים יותר בקרוב.
      </p>

      <div class="progress-label">
        <span>התקדמות השדרוג</span>
        <span><span id="pct">0</span>%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="console" id="console"></div>

      <div class="foot">
        <a href="mailto:support@example.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
          support@example.com
        </a>
        <span>|</span>
        <span>נחזור בהקדם האפשרי</span>
      </div>

    </div>
  </div>

<script>
  // ---------- Floating particles ----------
  const particlesEl = document.getElementById('particles');
  function spawnParticle(){
    const p = document.createElement('div');
    p.className = 'particle';
    const left = Math.random() * 100;
    const duration = 6 + Math.random() * 8;
    const drift = (Math.random() * 60 - 30) + 'px';
    p.style.left = left + 'vw';
    p.style.setProperty('--drift', drift);
    p.style.animationDuration = duration + 's';
    particlesEl.appendChild(p);
    setTimeout(() => p.remove(), duration * 1000);
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion){
    setInterval(spawnParticle, 450);
  }

  // ---------- Progress bar ----------
  const pctEl = document.getElementById('pct');
  const fillEl = document.getElementById('progressFill');
  let target = 0;
  const steps = [12, 27, 41, 58, 66, 74, 79, 83, 86, 87];
  let si = 0;
  function nextStep(){
    if (si < steps.length){
      target = steps[si++];
      pctEl.textContent = target;
      fillEl.style.width = target + '%';
      setTimeout(nextStep, 1500 + Math.random() * 900);
    }
  }
  setTimeout(nextStep, 500);

  // ---------- Console log typing ----------
  const consoleEl = document.getElementById('console');
  const logLines = [
    '$ system.status --check',
    '> סורק רכיבי מערכת... בוצע',
    '$ deploy --module ui-core',
    '> מתקין עדכוני ליבה...',
    '$ optimize --assets',
    '> דוחס משאבים... 87%',
    '$ security.patch --apply',
    '> מאבטח נקודות קצה...',
    '$ cache.rebuild',
    '> בונה מטמון מחדש...',
    '$ status --eta',
    '> משוער: בקרוב מאוד'
  ];
  let li = 0;
  function addLine(){
    const wrap = document.createElement('div');
    wrap.className = 'line';
    wrap.textContent = logLines[li % logLines.length];
    consoleEl.appendChild(wrap);
    li++;
    // keep only last ~7 lines visible
    while (consoleEl.children.length > 7){
      consoleEl.removeChild(consoleEl.firstChild);
    }
    consoleEl.scrollTop = consoleEl.scrollHeight;
    setTimeout(addLine, 1100 + Math.random() * 700);
  }
  addLine();

  // ---------- Subtle 3D tilt on panel ----------
  const panel = document.getElementById('panel');
  if (!reduceMotion && window.matchMedia('(hover: hover)').matches){
    document.addEventListener('mousemove', (e) => {
      const r = panel.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      panel.style.transform = `perspective(900px) rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 4).toFixed(2)}deg)`;
    });
    document.addEventListener('mouseleave', () => {
      panel.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
    });
  }
</script>

</body>
</html>
